<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Idle-игра про друга: от банки в гараже до самогонного коллайдера.">

  <!--
    Превью ссылки в Telegram, WhatsApp и ВКонтакте. Адреса — только полные:
    мессенджер читает страницу без <base> и относительный путь к картинке
    не найдёт. Адрес — имя репозитория; переименовали репозиторий —
    поправить здесь (это сверяет test/app_identity_test.dart).
    Картинку рисует tools/make_banner.py.
  -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="Витя в деле">
  <meta property="og:title" content="Витя в деле">
  <meta property="og:description" content="Idle-игра про друга: от банки в гараже до самогонного коллайдера. Играется прямо в браузере.">
  <meta property="og:url" content="https://mercurrial.github.io/vitya-v-dele/">
  <meta property="og:image" content="https://mercurrial.github.io/vitya-v-dele/og.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="Витя в деле: Витя в пиджаке и полка аппаратов от банки до коллайдера">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Витя в деле">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Витя в деле</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14100C">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <style>
    /*
      Игра держится на зажиме пальца, а браузер считает долгое нажатие
      приглашением что-нибудь выделить или показать меню. Без этих правил
      зажим по гаражу подсвечивал полэкрана синим, а на телефоне вызывал
      «Скопировать / Найти».

      Правила — на каждый элемент, а не только на html и body: в 1.0.0 они
      стояли на двух корнях, и на iPhone зажим всё равно открывал лупу.
      Наследованию Safari не верим, а своё Flutter рисует в теневом дереве,
      куда эти правила не доходят вовсе, — туда их ставит скрипт ниже.
    */
    html, body {
      margin: 0;
      background: #14100C;
      height: 100%;
      overflow: hidden;              /* нечего скролить: игра ровно в экран */
      overscroll-behavior: none;     /* и незачем тянуть страницу вниз */
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;    /* убирает задержку 300 мс на тап */
    }
    *, *::before, *::after {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;   /* Safari: меню по долгому нажатию */
    }
    /*
      Кроме полей ввода. Код переноса вставляют и копируют руками, когда
      браузер не дал буфер обмена: зажать поле — «Вставить», «Скопировать».
      Запрет выделения и меню поле ломает: на iPhone в него нельзя ни
      вставить, ни набрать. Поля Flutter — настоящие input и textarea
      поверх холста.
    */
    input, textarea, [contenteditable="true"] {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    /*
      Заставка, пока грузится Flutter. На медленном телефоне это несколько
      секунд, и раньше всё это время был просто тёмный экран — непонятно,
      грузится игра или сломалась. Убирается по первому кадру игры.
    */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #14100C;
      color: #EDE5D2;
      font: 500 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .25s ease-out;
    }
    #loader.gone { opacity: 0; }
    #loader img {
      width: 96px;
      height: 96px;
      border-radius: 22%;
      image-rendering: pixelated;    /* пиксель-арт, а не мыло */
      box-shadow: 0 6px 24px rgba(0, 0, 0, .5), 0 0 60px rgba(242, 176, 74, .18);
    }
    #loader .name {
      color: #F2B04A;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    /* Бак, который наполняется, — та же полоса, что в игре. */
    #loader .tank {
      width: 168px;
      height: 10px;
      padding: 2px;
      border: 2px solid #3A2A1A;
      background: #241A10;
    }
    #loader .tank div {
      height: 100%;
      width: 0;
      background: #E8A33D;
      animation: fill 1.6s steps(12) infinite;
    }
    @keyframes fill { to { width: 100%; } }
    #loader .hint { color: #8A7A66; min-height: 1.3em; }
    @media (prefers-reduced-motion: reduce) {
      #loader .tank div { animation: none; width: 60%; }
    }
  </style>
</head>
<body>
  <div id="loader" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">Витя в деле</div>
    <div class="tank"><div></div></div>
    <div class="hint">Витя открывает гараж…</div>
  </div>
  <script>
    /*
      Долгое нажатие — это жар, а не выделение, меню или лупа.

      CSS выше не хватает. Safari на iOS 15+ показывает лупу при зажиме
      даже там, где выделять нечего и запрет стоит на каждом элементе: так
      отзыв тестера на iPhone. Гасит её только отмена touchstart. Прокрутку
      это не ломает — её у игры нет, Flutter двигает списки сам; касание до
      игры всё равно доходит pointer-событиями.

      Отменяется только на iOS: на Android лупы нет, и незачем трогать то,
      что там работает. И никогда — в полях ввода, иначе в поле кода нельзя
      поставить курсор и вставить, и в дереве доступности: VoiceOver жмёт
      на его узлы, и отменённое касание не дошло бы до игры.
    */
    (function () {
      var ua = navigator.userAgent;
      var ios = /iPhone|iPad|iPod/.test(ua) ||
          (ua.indexOf('Macintosh') >= 0 && navigator.maxTouchPoints > 1);

      function spared(e) {
        var t = e.composedPath ? e.composedPath()[0] : e.target;
        if (!t || t.nodeType !== 1) return false;
        return t.isContentEditable ||
            !!t.closest('input, textarea, flt-semantics-host, flt-semantics-placeholder');
      }
      function stop(e) { if (!spared(e)) e.preventDefault(); }

      document.addEventListener('selectstart', stop);
      // Меню «Сохранить картинку как…» по правой кнопке и долгому нажатию.
      // Раньше его гасил Flutter (BrowserContextMenu), но целиком, вместе с
      // меню полей ввода: вставить код было нечем, кроме буфера обмена.
      document.addEventListener('contextmenu', stop);
      if (ios) document.addEventListener('touchstart', stop, { passive: false });

      // Холст Flutter лежит в теневом дереве flt-glass-pane: правила
      // страницы туда не проникают, свои ставятся изнутри. К первому кадру
      // дерево уже есть, а до него экран закрыт заставкой.
      window.addEventListener('flutter-first-frame', function () {
        var panes = document.querySelectorAll('flt-glass-pane');
        for (var i = 0; i < panes.length; i++) {
          var root = panes[i].shadowRoot;
          if (!root) continue;
          var style = document.createElement('style');
          style.textContent = '* { -webkit-user-select: none; user-select: none;' +
              ' -webkit-touch-callout: none; }';
          root.appendChild(style);
        }
      }, { once: true });
    })();

    (function () {
      var loader = document.getElementById('loader');
      // Первый кадр игры отмечает сам Flutter (движок 3.24:
      // platform_dispatcher.dart, канал flutter/service_worker).
      window.addEventListener('flutter-first-frame', function () {
        loader.classList.add('gone');
        setTimeout(function () { loader.remove(); }, 300);
      }, { once: true });
      // Если за полминуты игра так и не встала, молча крутить полосу дальше
      // — хуже всего: игрок решит, что надо ещё подождать.
      setTimeout(function () {
        if (!loader.isConnected) return;
        loader.querySelector('.hint').textContent =
          'Что-то долго. Обнови страницу — прогресс не пропадёт.';
      }, 30000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
